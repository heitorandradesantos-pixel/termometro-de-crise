name: Transcrever

# Transcreve o áudio de um vídeo gravado pelo Heitor (termometro/transcrever.py), para a edição cortar os erros e
# as pausas e pôr a legenda. O áudio chega criptografado (AES-256) num ramo temporário, apagado depois da edição;
# a chave vem no disparo e é escondida do log. O resultado sai no log entre TRANSCRICAO_INICIO e TRANSCRICAO_FIM.
on:
  workflow_dispatch:
    inputs:
      ramo:
        description: "ramo temporario com audio.enc"
        required: true
      chave:
        description: "chave do audio.enc"
        required: true
      modelo:
        description: "small, medium ou large-v3"
        required: false
        default: "medium"
      texto:
        description: "frases do roteiro (ajudam a acertar os nomes)"
        required: false
        default: ""

jobs:
  transcrever:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q faster-whisper numpy
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Abrir o audio
        env:
          RAMO: ${{ inputs.ramo }}
        run: |
          CHAVE=$(jq -r '.inputs.chave' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$CHAVE"
          git fetch -q origin "$RAMO"
          git show "FETCH_HEAD:audio.enc" > audio.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in audio.enc -out audio.ogg -pass "pass:$CHAVE"
          ls -la audio.ogg
      - name: Transcrever
        env:
          MODELO: ${{ inputs.modelo }}
          TEXTO: ${{ inputs.texto }}
        run: python termometro/transcrever.py audio.ogg
