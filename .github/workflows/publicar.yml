name: Publicar newsletter

# O site é publicado pelo Cloudflare Pages, que reconstrói sozinho a cada mudança
# no ramo principal (comando: python rodar.py --site). Aqui fica só a newsletter:
# quando uma edição entra no ramo principal, ela vai para a newsletter (Kit) uma vez só.
on:
  push:
    branches: [main]
    paths: ["edicoes/**/edicao.md"]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Agente Publicador (newsletter no Kit; beehiiv como alternativa)
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_ENVIO: ${{ vars.KIT_ENVIO }}
          WHATSAPP_URL: ${{ vars.WHATSAPP_URL }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          BEEHIIV_ENVIO: ${{ vars.BEEHIIV_ENVIO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python rodar.py --newsletter
      - name: Marcar como enviada
        run: |
          if [ -n "$(git status --porcelain edicoes)" ]; then
            git config user.name "termometro-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add edicoes
            git commit -m "Newsletter enviada"
            git push
          fi
