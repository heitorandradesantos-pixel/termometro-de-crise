# Publica um Reel no Instagram, no horário escolhido pelo Heitor (o editor dispara na hora marcada).
# O vídeo e a legenda vêm criptografados num ramo temporário, que é apagado no fim.
name: Publicar Reel
on:
  workflow_dispatch:
    inputs:
      ramo:
        description: "ramo temporário com o post criptografado"
        required: true
      chave:
        description: "chave para abrir o post"
        required: true
      modo:
        description: "testar (sobe e confere, sem publicar) ou publicar"
        required: true
        default: testar

permissions:
  contents: write

concurrency:
  group: publicar-reel
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Abrir o post
        run: |
          CHAVE=$(jq -r '.inputs.chave' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$CHAVE"
          RAMO=$(jq -r '.inputs.ramo' "$GITHUB_EVENT_PATH")
          case "$RAMO" in tmp-publicar-*) ;; *) echo "ramo inválido"; exit 1 ;; esac
          git fetch -q origin "$RAMO"
          mkdir -p _post
          git show "origin/$RAMO:post.tar.enc" > _post/post.tar.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass "pass:$CHAVE" -in _post/post.tar.enc | tar -x -C _post
      - name: Publicar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m termometro.reels _post "${{ inputs.modo }}"
      - name: Apagar o ramo temporário
        if: always() && inputs.modo == 'publicar'
        run: git push -q origin --delete "${{ inputs.ramo }}" || true
