name: Publicar

# Roda quando uma edição entra no ramo principal (você aprovou o Pull Request,
# ou o modo automático publicou). Atualiza o site e manda a newsletter uma vez só.
on:
  push:
    branches: [main]
    paths: ["edicoes/**/edicao.md"]
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Agente Editor do site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DOMINIO: ${{ vars.DOMINIO }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
        run: python rodar.py --site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  newsletter:
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Agente Publicador (beehiiv)
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          BEEHIIV_ENVIO: ${{ vars.BEEHIIV_ENVIO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python rodar.py --newsletter
      - name: Marcar como enviada
        run: |
          if [ -n "$(git status --porcelain edicoes)" ]; then
            git config user.name "termometro-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add edicoes
            git commit -m "Newsletter enviada"
            git push
          fi
