name: Panorama diário

# Todo dia útil, depois do fechamento das bolsas, o robô atualiza o termômetro de cada país,
# pede ao agente Correspondente as notícias que mexem com cada região e monta o panorama
# do WhatsApp. Se a conferência aprovar, publica sozinho no site (o Cloudflare reconstrói).
# Se segurar, abre um pedido de aprovação. Com a variável DIARIO_AUTOMATICO=nao, sempre pede.
on:
  # O GitHub às vezes atrasa ou pula um agendamento (e um agendamento externo também dispara este robô): qualquer
  # execução sem "forcar" só trabalha se o panorama
  # do dia ainda não saiu (nem está esperando aprovação), então nunca há panorama nem custo em dobro.
  schedule:
    - cron: "17 21 * * 1-5" # 18:17 em Brasília, de segunda a sexta (bolsa de Nova York já fechou)
    - cron: "47 21 * * 1-5" # reserva: 18:47
    - cron: "47 22 * * 1-5" # reserva: 19:47
  workflow_dispatch:
    inputs:
      forcar:
        description: "Refazer o panorama de hoje mesmo que ele já tenha saído (sim/nao)"
        required: false
        default: "nao"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: panorama-diario
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      MODELO_CLAUDE: ${{ vars.MODELO_CLAUDE }}
      BUSCAS_POR_REGIAO: ${{ vars.BUSCAS_POR_REGIAO }}
    steps:
      - uses: actions/checkout@v4

      - name: O panorama de hoje já saiu?
        id: guarda
        run: |
          HOJE=$(TZ=America/Sao_Paulo date +%F)
          if [ "${{ inputs.forcar }}" != "sim" ] && { [ -f "diario/$HOJE/panorama.txt" ] || \
             git ls-remote --exit-code origin "panorama-$HOJE" >/dev/null 2>&1; }; then
            echo "O panorama de $HOJE já saiu ou espera aprovação: este horário de reserva não faz nada."
            echo "pular=sim" >> "$GITHUB_OUTPUT"
          else
            echo "pular=nao" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guarda.outputs.pular != 'sim'
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        if: steps.guarda.outputs.pular != 'sim'
        run: pip install -q -r requirements.txt

      - name: Testes
        if: steps.guarda.outputs.pular != 'sim'
        run: python -m pytest -q

      - name: Motor mundial, Correspondente e panorama
        if: steps.guarda.outputs.pular != 'sim'
        id: diario
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python rodar.py --diario

      - name: Publicar ou pedir aprovação
        id: publicar
        if: steps.guarda.outputs.pular != 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
          DIARIO_AUTOMATICO: ${{ vars.DIARIO_AUTOMATICO }}
          DATA: ${{ steps.diario.outputs.data }}
          APROVADO: ${{ steps.diario.outputs.aprovado }}
        run: |
          git config user.name "termometro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diario
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          if [ "$DIARIO_AUTOMATICO" != "nao" ] && [ "$APROVADO" = "sim" ]; then
            git commit -q -m "Panorama de $DATA"
            git pull -q --rebase origin "$GITHUB_REF_NAME"
            git push
            echo "publicado=sim" >> "$GITHUB_OUTPUT"
          else
            RAMO="panorama-$DATA"
            git switch -c "$RAMO"
            git commit -q -m "Panorama de $DATA"
            git push --force -u origin "$RAMO"
            gh pr create --base "$GITHUB_REF_NAME" --head "$RAMO" \
              --title "Panorama de $DATA: aprovar?" --body-file "diario/$DATA/resumo.md" \
              || gh pr edit "$RAMO" --body-file "diario/$DATA/resumo.md"
          fi
          echo "### Texto para o WhatsApp" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "diario/$DATA/panorama.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Enviar o card do fechamento ao WhatsApp
        if: steps.publicar.outputs.publicado == 'sim'
        continue-on-error: true
        env:
          ZAPI_INSTANCIA: ${{ secrets.ZAPI_INSTANCIA }}
          ZAPI_TOKEN: ${{ secrets.ZAPI_TOKEN }}
          ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
          WHATSAPP_ENVIO: ${{ vars.WHATSAPP_ENVIO }}
          WHATSAPP_DESTINO: ${{ vars.WHATSAPP_DESTINO }}
          WHATSAPP_TESTE: ${{ vars.WHATSAPP_TESTE }}
          DATA: ${{ steps.diario.outputs.data }}
        run: |
          python rodar.py --whatsapp fechamento --data "$DATA"
          git add diario
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "WhatsApp: fechamento de $DATA enviado"
          git pull -q --rebase origin main
          git push
