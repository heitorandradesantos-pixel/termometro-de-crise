name: WhatsApp

# Envio automático para a comunidade do WhatsApp, com o Baileys (código aberto; ver whatsapp/enviar.mjs).
# - parear: liga o número ao robô (uma vez só): o celular recebe o pedido e a pessoa digita o código de 8 letras
#   em Aparelhos conectados > Conectar com número de telefone.
# - teste: manda o card e o panorama do último fechamento para o próprio número (conversa "você").
# - fechamento: manda o fechamento para a comunidade (respeita o modo em whatsapp/modo.txt e nunca manda duas
#   vezes). O robô diário chama esta ação sozinho depois de publicar o panorama.
# - abertura: como o mundo amanheceu e como o Brasil abriu, todo dia útil logo depois que a B3 abre (10h21).
# - roteiros: manda para a conversa do próprio número os roteiros novos do dia (teleprompter, texto da tela, imagens
#   de apoio e legenda), para o Heitor gravar. O Plantão chama esta ação depois de cada artigo.
# - fimdesemana: a edição de domingo (18h30, piloto de 8 domingos), no grupo, com commodities e cripto (Yahoo Finance,
#   fonte citada). FDS_MODO=previa manda só para o próprio número; FDS_NUMEROS=nao tira os números.
# - foto: põe a logo (marca/perfil-1080.png) como foto da comunidade e do grupo de avisos.
# O número e o código ficam fora do registro público; a sessão fica no cache do GitHub, criptografada.
on:
  schedule:
    - cron: "21 13 * * 1-5" # 10h21 em Brasília: abertura (um agendamento externo também dispara; nunca manda duas vezes)
  workflow_dispatch:
    inputs:
      acao:
        description: "parear, teste, teste-abertura, fechamento, abertura, roteiros, fimdesemana, ideias ou foto"
        required: true
        default: "teste"
      numero:
        description: "parear: número com 55 e DDD, só dígitos"
        required: false
        default: ""
      codigo:
        description: "parear: código de 8 letras (opcional)"
        required: false
        default: ""
      data:
        description: "fechamento: dia (AAAA-MM-DD); vazio = o último"
        required: false
        default: ""
  workflow_call:
    inputs:
      acao:
        type: string
        required: true
      data:
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: whatsapp-sessao # uma conexão por vez com a mesma sessão
  cancel-in-progress: false

jobs:
  whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WHATSAPP_ENVIO: ${{ vars.WHATSAPP_ENVIO }}
      WA_COMUNIDADE: ${{ vars.WA_COMUNIDADE }}
      FDS_MODO: ${{ vars.FDS_MODO }}
      FDS_NUMEROS: ${{ vars.FDS_NUMEROS }}
      WA_SESSAO: ${{ github.workspace }}/.sessao-wa
      ACAO: ${{ inputs.acao || 'abertura' }}
      DATA: ${{ inputs.data }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # chamado pelo robô diário, pega o panorama que acabou de ser publicado

      - name: Número e código fora do registro
        run: |
          NUMERO=$(jq -r '.inputs.numero // ""' "$GITHUB_EVENT_PATH")
          CODIGO=$(jq -r '.inputs.codigo // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$NUMERO" ]; then echo "::add-mask::$NUMERO"; echo "WA_NUMERO=$NUMERO" >> "$GITHUB_ENV"; fi
          if [ -n "$CODIGO" ]; then echo "::add-mask::$CODIGO"; echo "WA_CODIGO=$CODIGO" >> "$GITHUB_ENV"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: whatsapp/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: whatsapp

      - uses: actions/setup-python@v5
        if: inputs.acao != 'parear'
        with:
          python-version: "3.12"
          cache: pip
      - if: inputs.acao != 'parear'
        run: pip install -q -r requirements.txt

      - name: Sessão guardada
        uses: actions/cache/restore@v4
        with:
          path: .sessao-wa.enc
          key: wa-sessao-${{ github.run_id }}
          restore-keys: wa-sessao-
      - name: Abrir a sessão
        env:
          WA_CHAVE: ${{ secrets.WA_CHAVE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash whatsapp/sessao.sh abrir

      - name: Ligar o número
        if: inputs.acao == 'parear'
        working-directory: whatsapp
        run: node enviar.mjs parear

      - name: Preparar o envio
        if: inputs.acao != 'parear'
        run: |
          case "$ACAO" in
            teste) python rodar.py --whatsapp preparar --teste --data "$DATA" ;;
            teste-abertura) python rodar.py --whatsapp preparar --teste --tipo abertura ;;
            abertura) python rodar.py --whatsapp preparar --tipo abertura ;;
            roteiros) python rodar.py --whatsapp roteiros --data "$DATA" ;;
            ideias) python rodar.py --whatsapp ideias ;;
            fimdesemana) python rodar.py --whatsapp fimdesemana ${DATA:+--data "$DATA"} ;;
            foto) echo "Foto: nada a preparar." ;;
            *) python rodar.py --whatsapp preparar --data "$DATA" ;;
          esac
      - name: Trocar a foto da comunidade (logo)
        if: inputs.acao == 'foto'
        working-directory: whatsapp
        run: node enviar.mjs foto ../marca/perfil-1080.png

      - name: Enviar
        if: inputs.acao != 'parear' && inputs.acao != 'foto' && hashFiles('_whatsapp/envio.json') != ''
        working-directory: whatsapp
        run: node enviar.mjs "$(case "$ACAO" in teste*) echo teste ;; *) echo enviar ;; esac)" ../_whatsapp/envio.json

      - name: Roteiro do Reel (Roteirista)
        if: (env.ACAO == 'abertura' || env.ACAO == 'fechamento') && hashFiles('_whatsapp/envio.json') != ''
        continue-on-error: true # sem roteiro, o envio do WhatsApp segue igual
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERSONA_NOME: ${{ vars.PERSONA_NOME }}
        run: python rodar.py --roteiro "$ACAO"

      - name: Roteiro para gravar (conversa do próprio número)
        if: (env.ACAO == 'abertura' || env.ACAO == 'fechamento') && hashFiles('_whatsapp/envio.json') != ''
        continue-on-error: true # sem isso, o envio do grupo segue igual
        run: |
          python rodar.py --whatsapp roteiros --pasta _roteiros ${DATA:+--data "$DATA"}
          if [ -f _roteiros/envio.json ]; then
            (cd whatsapp && node enviar.mjs enviar ../_roteiros/envio.json)
            python rodar.py --whatsapp concluir --pasta _roteiros
          fi

      - name: Registrar o envio
        if: always() && env.ACAO != 'parear' && !startsWith(env.ACAO, 'teste') && hashFiles('_whatsapp/envio.json') != ''
        run: |
          python rodar.py --whatsapp concluir
          git config user.name "termometro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diario
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "WhatsApp: registro do envio ($ACAO) e roteiro do Reel"
          git pull -q --rebase origin main
          git push

      - name: Guardar a sessão
        if: always()
        env:
          WA_CHAVE: ${{ secrets.WA_CHAVE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash whatsapp/sessao.sh guardar
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.sessao-wa.enc') != ''
        with:
          path: .sessao-wa.enc
          key: wa-sessao-${{ github.run_id }}-${{ github.run_attempt }}
