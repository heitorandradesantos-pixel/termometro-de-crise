name: WhatsApp

# Ferramenta manual do envio automático: "listar" mostra os grupos e comunidades do número ligado à Z-API (para
# achar o grupo de avisos e gravar na variável WHATSAPP_DESTINO); "teste" manda uma mensagem para WHATSAPP_TESTE;
# "fechamento" reenvia o card do último fechamento (respeita WHATSAPP_ENVIO e não manda duas vezes).
on:
  workflow_dispatch:
    inputs:
      acao:
        description: "listar, teste ou fechamento"
        required: true
        default: "listar"

permissions:
  contents: write

concurrency:
  group: panorama-diario
  cancel-in-progress: false

jobs:
  whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZAPI_INSTANCIA: ${{ secrets.ZAPI_INSTANCIA }}
      ZAPI_TOKEN: ${{ secrets.ZAPI_TOKEN }}
      ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
      WHATSAPP_ENVIO: ${{ vars.WHATSAPP_ENVIO }}
      WHATSAPP_DESTINO: ${{ vars.WHATSAPP_DESTINO }}
      WHATSAPP_TESTE: ${{ vars.WHATSAPP_TESTE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python rodar.py --whatsapp "${{ inputs.acao }}"
      - name: Guardar o registro do envio
        if: inputs.acao == 'fechamento'
        run: |
          git config user.name "termometro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diario
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "WhatsApp: registro do envio"
          git pull -q --rebase origin main
          git push
