name: Plantão de notícias

# Cinco turnos por dia (de Brasília): 9h13 o contexto do mercado do dia, 11h43 a notícia internacional quente e o
# efeito no Brasil, 13h13 a notícia de dinheiro do cotidiano, 16h13 o assunto que viralizou nas redes (verdade ou
# exagero) e 18h43 a atualização de um caso já publicado ou o caso quente do dia. Um artigo por turno, no máximo 5 por
# dia (PLANTAO_POR_DIA); o tema pedido pelo editor não conta no limite. Cada artigo vira roteiro de Reel.
# Em cada turno o robô procura o assunto de dinheiro que mais
# gente está buscando no Google, escreve "o que se sabe" com fonte em cada fato e publica sozinho se passar
# na conferência. Nada passa sem fonte devolvida pela própria busca. Com a variável PLANTAO_AUTOMATICO=nao,
# cada artigo vira um pedido de aprovação em vez de ir direto ao ar.
on:
  schedule:
    - cron: "13 12 * * *" # 9h13 em Brasília: manhã
    - cron: "43 14 * * *" # 11h43: meio da manhã (internacional)
    - cron: "13 16 * * *" # 13h13: tarde
    - cron: "13 19 * * *" # 16h13: viral
    - cron: "43 21 * * *" # 18h43: fim do dia
  workflow_dispatch:
    inputs:
      tema:
        description: "Assunto escolhido pelo editor (deixe vazio para o robô escolher)"
        required: false
        default: ""
      turno:
        description: "manha, meio, tarde, viral ou noite (vazio = pelo horário)"
        required: false
        default: ""
      origem:
        description: "referencias = pauta sugerida pelo robô de referências (não pode repetir assunto)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write # o WhatsApp chamado daqui também dispara workflows (pedidos de roteiro)

concurrency:
  group: panorama-diario
  cancel-in-progress: false

jobs:
  plantao:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publicado: ${{ steps.plantao.outputs.publicar }}
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      MODELO_CLAUDE: ${{ vars.MODELO_CLAUDE }}
      PLANTAO_MAXIMO: ${{ vars.PLANTAO_MAXIMO }}
      PLANTAO_POR_DIA: ${{ vars.PLANTAO_POR_DIA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -q -r requirements.txt
      - name: Testes
        run: python -m pytest -q
      - name: Pauta, reportagem e conferência
        id: plantao
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEMA: ${{ inputs.tema }}
          PLANTAO_TURNO: ${{ inputs.turno }}
          PLANTAO_ORIGEM: ${{ inputs.origem }}
        run: python rodar.py --plantao --tema "$TEMA"
      - name: Publicar ou pedir aprovação
        if: steps.plantao.outputs.publicar == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
          PLANTAO_AUTOMATICO: ${{ vars.PLANTAO_AUTOMATICO }}
        run: |
          git config user.name "termometro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diario/plantao
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          TITULO=$(git diff --cached --name-only | head -1 | xargs -I{} python -c "import json,sys;print(json.load(open('{}'))['titulo'])")
          if [ "$PLANTAO_AUTOMATICO" != "nao" ]; then
            git commit -q -m "Plantão: $TITULO"
            git pull -q --rebase origin main
            git push
          else
            RAMO="plantao-$(date +%Y%m%d-%H%M)"
            git switch -c "$RAMO"
            git commit -q -m "Plantão: $TITULO"
            git push -u origin "$RAMO"
            gh pr create --base main --head "$RAMO" --title "Plantão: $TITULO (aprovar?)" --body "Artigo do Plantão conferido pelo robô. Aprovar publica no site."
          fi
          echo "### Publicado: $TITULO" >> "$GITHUB_STEP_SUMMARY"
      - name: Roteiro do Reel Explica (Roteirista)
        if: steps.plantao.outputs.publicar == 'sim' && vars.PLANTAO_AUTOMATICO != 'nao'
        continue-on-error: true # sem roteiro, o artigo já está no ar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERSONA_NOME: ${{ vars.PERSONA_NOME }}
        run: |
          python rodar.py --roteiro explica
          git add diario
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Roteirista: roteiro do Reel Explica [CF-Pages-Skip]"
          git pull -q --rebase origin main
          git push

  roteiro-whatsapp:
    # o roteiro do Reel vai para a conversa do próprio número, para o Heitor gravar
    needs: plantao
    if: needs.plantao.outputs.publicado == 'sim' && vars.PLANTAO_AUTOMATICO != 'nao'
    uses: ./.github/workflows/whatsapp.yml
    with:
      acao: roteiros
    secrets: inherit
