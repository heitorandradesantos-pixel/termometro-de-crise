name: Conselho de monetização

# Os agentes de marketing, comportamento do lead, vendas, SEO, UX e o guardião de regras debatem em três rodadas
# e fecham um plano. A ata vira uma issue "Conselho de monetização: ata de AAAA-MM-DD".
# Roda no dia 1 de cada mês e quando alguém aperta "Run workflow".
on:
  schedule:
    - cron: "41 12 1 * *" # dia 1 de cada mês, 09:41 em Brasília
  workflow_dispatch:
    inputs:
      pergunta:
        description: "Tema para consultar o time (em branco = reunião de monetização)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  conselho:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODELO_CLAUDE: ${{ vars.MODELO_CLAUDE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Trazer o último relatório da squad de design
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p design/ultimo
          gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=30" \
            --jq '[.[] | select(.title | startswith("Squad de design"))][0].body // ""' > design/ultimo/relatorio.md
      - name: Reunião do conselho
        id: conselho
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERGUNTA_CONSELHO: ${{ inputs.pergunta }}
        run: python rodar.py --conselho
      - name: Guardar a conversa
        uses: actions/upload-artifact@v4
        with:
          name: conselho-${{ steps.conselho.outputs.data }}
          path: conselho/
      - name: Abrir a issue com a ata
        env:
          GH_TOKEN: ${{ github.token }}
          DATA: ${{ steps.conselho.outputs.data }}
          PERGUNTA: ${{ inputs.pergunta }}
        run: |
          TITULO="Conselho de monetização: ata de $DATA"
          if [ -n "$PERGUNTA" ]; then TITULO="Consulta ao time ($DATA): ${PERGUNTA:0:70}"; fi
          NUMERO=$(gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$TITULO" \
            -F body=@"conselho/$DATA/ata.md" --jq .number)
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMERO/comments" -F body=@"conselho/$DATA/conversa.md" --jq .html_url
          cat "conselho/$DATA/ata.md" >> "$GITHUB_STEP_SUMMARY"
