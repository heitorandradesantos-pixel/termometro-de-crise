name: Teste do motor mundial

# Só roda quando alguém aperta "Run workflow". Baixa os dados dos países, calcula
# os termômetros por região e mostra o teste histórico. Não publica nada.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mundo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python sondas/motor_mundial.py
      - uses: actions/upload-artifact@v4
        with:
          name: saida-mundo
          path: saida_mundo/
